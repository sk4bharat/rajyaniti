<!--
  ════════════════════════════════════════════════════════════
  sk4bharat — Sitewide Search Integration Snippet
  ════════════════════════════════════════════════════════════

  STEP 1 — Add these two files to your repo root:
    /rajyaniti/search.js
    /rajyaniti/search-index.json

  STEP 2 — Add the <script> tag just before </body> on EVERY page:
    (index.html, article.html, book-reviews.html, quiz.html, etc.)

  STEP 3 — Add the search button to your <nav> (see below).

  STEP 4 — Update search-index.json whenever you publish a new article.
  ════════════════════════════════════════════════════════════
-->


<!-- ─────────────────────────────────────────────────────────
     STEP 2 · Script tag — paste just before </body> on every page
     ───────────────────────────────────────────────────────── -->
<script src="/rajyaniti/search.js" defer></script>


<!-- ─────────────────────────────────────────────────────────
     STEP 3 · Search button for your nav
     Add this button inside your existing <nav> element,
     alongside your current links. It opens the modal on click.
     ───────────────────────────────────────────────────────── -->
<button
  onclick="window.skOpenSearch()"
  aria-label="Search (Ctrl+K)"
  title="Search (⌘K)"
  style="
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    color: inherit;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  "
  onmouseover="this.style.background='rgba(0,0,0,0.05)'"
  onmouseout="this.style.background='transparent'"
>
  <!-- Search icon (inline SVG, no dependency) -->
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round"
       aria-hidden="true">
    <circle cx="11" cy="11" r="8"/>
    <path d="m21 21-4.35-4.35"/>
  </svg>
  Search
  <kbd style="
    font-size: 10px;
    background: rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: inherit;
    color: #999;
  ">⌘K</kbd>
</button>


<!--
  ─────────────────────────────────────────────────────────────
  STEP 4 · Updating the index

  Each entry in search-index.json has this shape:
  {
    "type":  "article" | "book" | "quiz",
    "title": "Full title of the piece",
    "tags":  ["Tag1", "Tag2"],
    "url":   "/rajyaniti/page.html",
    "date":  "MMM DD, YYYY"
  }

  Whenever you publish a new article, add one object to the array.
  The search script fetches this file fresh each session — no
  rebuild or server restart needed.
  ─────────────────────────────────────────────────────────────

  ─────────────────────────────────────────────────────────────
  KEYBOARD SHORTCUTS (built in, no extra config needed)

    ⌘K / Ctrl+K   → open search
    ESC            → close search
    ↑ / ↓          → move through results
    Enter          → navigate to selected result
  ─────────────────────────────────────────────────────────────
-->
