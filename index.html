<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>डॉ. राधेश्याम शर्मा | इतिहासकार</title>
  <meta name="description" content="इतिहासकार डॉ. राधेश्याम शर्मा की आधिकारिक वेबसाइट, शोध, पुस्तकों, व्याख्यान और संपर्क जानकारी।" />
  <style>
    :root{
      --bg: #f7f1e3;
      --bg-2: #efe3c6;
      --primary: #6b3f1d;
      --primary-dark: #3d220f;
      --secondary: #b86e3c;
      --accent: #d9a15d;
      --gold: #d4af72;
      --text: #1d1b1a;
      --muted: #685d56;
      --white: #fffdf9;
      --card: rgba(255,255,255,0.55);
      --shadow: 0 12px 30px rgba(67, 42, 24, 0.15);
      --max: 1180px;
    }

    *{ box-sizing: border-box; }
    html{ scroll-behavior: smooth; }
    body{
      margin:0;
      font-family: "Noto Sans Devanagari", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, #f9f4ee 100%);
      color: var(--text);
      line-height: 1.7;
    }

    img{ max-width: 100%; display:block; }
    a{ text-decoration:none; color: inherit; }
    ul{ list-style:none; margin:0; padding:0; }

    .container{
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar{
      background: rgba(41, 22, 10, 0.9);
      color: var(--white);
      font-size: 0.95rem;
      position: sticky;
      top:0;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .topbar .container{
      display:flex;
      justify-content:space-between;
      align-items:center;
      min-height: 48px;
      gap: 20px;
    }

    .topbar .info{
      display:flex;
      gap: 20px;
      flex-wrap:wrap;
    }

    .topbar .socials{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .topbar .socials a{
      width: 28px;
      height: 28px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background: rgba(255,255,255,0.08);
      transition: .3s ease;
    }

    .topbar .socials a:hover{
      background: var(--secondary);
      transform: translateY(-2px);
    }

    header.site-header{
      background: rgba(255,255,255,0.64);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 48px;
      z-index: 999;
      border-bottom: 1px solid rgba(107,63,29,0.08);
    }

    .nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      min-height: 80px;
      gap: 20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 14px;
      font-weight:700;
      color: var(--primary-dark);
    }

    .brand-mark{
      width: 48px;
      height: 48px;
      border-radius:50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display:grid;
      place-items:center;
      color: var(--white);
      font-size: 1.2rem;
      box-shadow: var(--shadow);
    }

    .brand-text small{
      display:block;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .menu{
      display:flex;
      align-items:center;
      gap: 28px;
      font-weight:600;
      color: var(--primary-dark);
    }

    .menu a{
      position: relative;
      padding-bottom: 4px;
    }

    .menu a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:0;
      height: 2px;
      width:0;
      background: var(--secondary);
      transition: width .3s ease;
    }

    .menu a:hover::after{ width:100%; }

    .cta-btn, .btn-outline{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight:700;
      transition: .25s ease;
      cursor:pointer;
      border: none;
    }

    .cta-btn{
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: var(--white);
      box-shadow: 0 10px 20px rgba(107,63,29,0.25);
    }

    .cta-btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(107,63,29,0.22);
    }

    .btn-outline{
      background: transparent;
      border: 1px solid rgba(107,63,29,0.35);
      color: var(--primary-dark);
    }

    .btn-outline:hover{
      background: rgba(107,63,29,0.06);
    }

    .mobile-toggle{
      display:none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border:1px solid rgba(107,63,29,0.2);
      background: rgba(255,255,255,0.7);
      font-size: 1.4rem;
      color: var(--primary-dark);
      cursor:pointer;
    }

    .hero{
      padding: 80px 0 60px;
      background:
        radial-gradient(circle at top left, rgba(217,161,93,0.22), transparent 20%),
        radial-gradient(circle at bottom right, rgba(107,63,29,0.12), transparent 25%),
        linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0.18));
    }

    .hero-grid{
      display:grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items:center;
      gap: 40px;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:12px;
      padding: 10px 18px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 999px;
      background: rgba(216,179,123,0.18);
      color: var(--primary);
      border: 1px solid rgba(107,63,29,0.12);
      margin-bottom: 18px;
      font-weight:700;
    }

    .hero h1{
      font-size: clamp(2.4rem, 5vw, 5rem);
      line-height: 1.08;
      margin: 0 0 20px;
      color: var(--primary-dark);
      letter-spacing: -0.04em;
    }

    .hero h1 .accent{
      color: var(--secondary);
    }

    .hero p{
      margin: 0 0 28px;
      font-size: 1.08rem;
      max-width: 620px;
      color: var(--muted);
    }

    .hero-actions{
      display:flex;
      flex-wrap:wrap;
      gap: 16px;
      margin-bottom: 28px;
    }

    .stats{
      display:flex;
      flex-wrap:wrap;
      gap: 18px;
      margin-top: 28px;
    }

    .stat{
      min-width: 150px;
      background: rgba(255,255,255,0.56);
      border: 1px solid rgba(107,63,29,0.1);
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }

    .stat strong{
      display:block;
      font-size: clamp(1.4rem, 2vw, 2rem);
      line-height:1.2;
      color: var(--primary-dark);
    }

    .stat span{
      color: var(--muted);
      font-size: 0.92rem;
    }

    .hero-visual{
      position: relative;
      padding: 20px;
    }

    .portrait-card{
      background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.75));
      border: 1px solid rgba(107,63,29,0.08);
      box-shadow: var(--shadow);
      border-radius: 32px;
      overflow: hidden;
    }

    .portrait-card .img-wrap{
      height: 640px;
      background:
        linear-gradient(180deg, rgba(35,25,18,0.05), rgba(35,25,18,0.25)),
        url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=900&q=80') center/cover no-repeat;
      position: relative;
    }

    .portrait-badge{
      position:absolute;
      left: 22px;
      bottom: 22px;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 14px 18px;
      border:1px solid rgba(107,63,29,0.08);
      box-shadow: var(--shadow);
      max-width: 240px;
    }

    .portrait-badge strong{
      display:block;
      color: var(--primary-dark);
      font-size: 1.1rem;
    }

    .portrait-badge span{
      color: var(--muted);
      font-size: 0.9rem;
    }

    .section{
      padding: 90px 0;
    }

    .section-header{
      max-width: 720px;
      margin: 0 auto 42px;
      text-align:center;
    }

    .section-header .kicker{
      display:inline-block;
      margin-bottom: 10px;
      color: var(--secondary);
      font-weight:700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    .section-header h2{
      margin: 0 0 12px;
      font-size: clamp(2rem, 3.5vw, 3rem);
      color: var(--primary-dark);
      letter-spacing: -0.04em;
    }

    .section-header p{
      margin:0;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .about-grid{
      display:grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 32px;
      align-items:center;
    }

    .about-image{
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      min-height: 500px;
      background:
        linear-gradient(180deg, rgba(12,8,6,0.15), rgba(12,8,6,0.45)),
        url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1000&q=80') center/cover no-repeat;
    }

    .about-bubble{
      position:absolute;
      right:18px;
      bottom:18px;
      max-width: 260px;
      background: rgba(255,255,255,0.8);
      border:1px solid rgba(107,63,29,0.08);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }

    .about-bubble strong{
      display:block;
      color: var(--primary-dark);
      font-size: 1.05rem;
    }

    .about-copy{
      background: rgba(255,255,255,0.45);
      border: 1px solid rgba(107,63,29,0.08);
      border-radius: 28px;
      padding: 30px;
      box-shadow: var(--shadow);
    }

    .about-copy p{
      color: var(--muted);
      margin-bottom: 18px;
    }

    .check-list{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 14px 16px;
      margin-top: 20px;
    }

    .check-list li{
      display:flex;
      align-items:flex-start;
      gap: 10px;
      color: var(--primary-dark);
      font-weight:600;
    }

    .check-list li::before{
      content:"✓";
      color: var(--secondary);
      font-weight:900;
      font-size: 1.1rem;
      line-height:1.2;
    }

    .feature-grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 24px;
      margin-top: 30px;
    }

    .feature-card{
      background: rgba(255,255,255,0.58);
      border:1px solid rgba(107,63,29,0.08);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: var(--shadow);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .feature-card:hover{
      transform: translateY(-5px);
      box-shadow: 0 18px 40px rgba(67,42,24,0.12);
    }

    .feature-icon{
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, rgba(107,63,29,0.12), rgba(184,110,60,0.18));
      color: var(--primary);
      border-radius: 16px;
      display:grid;
      place-items:center;
      font-size: 1.5rem;
      margin-bottom: 18px;
    }

    .feature-card h3{
      margin: 0 0 10px;
      font-size: 1.25rem;
      color: var(--primary-dark);
    }

    .feature-card p{
      margin:0;
      color: var(--muted);
    }

    .timeline-wrap{
      position: relative;
      margin-top: 30px;
    }

    .timeline-wrap::before{
      content:"";
      position:absolute;
      left: 50%;
      transform: translateX(-50%);
      top:0;
      bottom:0;
      width:2px;
      background: linear-gradient(180deg, rgba(107,63,29,0.18), rgba(184,110,60,0.35), rgba(107,63,29,0.18));
    }

    .timeline{
      display:grid;
      gap: 26px;
    }

    .timeline-item{
      width: calc(50% - 22px);
      position:relative;
      background: rgba(255,255,255,0.6);
      border:1px solid rgba(107,63,29,0.08);
      border-radius: 24px;
      padding: 24px 22px;
      box-shadow: var(--shadow);
    }

    .timeline-item:nth-child(odd){
      margin-right: auto;
    }

    .timeline-item:nth-child(even){
      margin-left: auto;
    }

    .timeline-item::before{
      content:"";
      position:absolute;
      top: 28px;
      width: 16px;
      height:16px;
      background: var(--secondary);
      border-radius:50%;
      border:4px solid #f9f4ee;
      box-shadow: 0 0 0 2px rgba(184,110,60,0.12);
    }

    .timeline-item:nth-child(odd)::before{
      right: -31px;
    }

    .timeline-item:nth-child(even)::before{
      left: -31px;
    }

    .timeline-item .year{
      display:inline-block;
      font-weight:800;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    .timeline-item h3{
      margin:0 0 10px;
      font-size: 1.25rem;
      color: var(--primary-dark);
    }

    .timeline-item p{
      margin:0;
      color: var(--muted);
    }

    .books-grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 26px;
      margin-top: 28px;
    }

    .book-card{
      background: rgba(255,255,255,0.6);
      border:1px solid rgba(107,63,29,0.08);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform .25s ease;
    }

    .book-card:hover{
      transform: translateY(-6px);
    }

    .book-cover{
      height: 260px;
      background: linear-gradient(135deg, #7a4a2a, #dbaf6c);
      display:flex;
      align-items:end;
      justify-content:center;
      padding:22px;
      position:relative;
      overflow:hidden;
    }

    .book-cover::before{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent);
    }

    .book-cover span{
      position:relative;
      z-index:1;
      color: var(--white);
      font-size: 1.1rem;
      font-weight:800;
      letter-spacing:0.08em;
      text-transform: uppercase;
      text-align:center;
    }

    .book-content{
      padding: 22px 20px 24px;
    }

    .book-content h3{
      margin:0 0 10px;
      color: var(--primary-dark);
      font-size: 1.25rem;
    }

    .book-content p{
      margin:0 0 18px;
      color: var(--muted);
    }

    .book-meta{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      color: var(--primary);
      font-weight:700;
      font-size: 0.9rem;
    }

    .articles-grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 24px;
      margin-top: 24px;
    }

    .article-card{
      background: rgba(255,255,255,0.6);
      border:1px solid rgba(107,63,29,0.08);
      padding: 24px 22px;
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .article-card .tag{
      display:inline-flex;
      padding:6px 10px;
      border-radius: 999px;
      background: rgba(217,161,93,0.18);
      color: var(--secondary);
      font-weight:700;
      font-size: 0.76rem;
      margin-bottom: 12px;
    }

    .article-card h3{
      margin:0 0 12px;
      font-size: 1.28rem;
      color: var(--primary-dark);
    }

    .article-card p{
      margin:0 0 18px;
      color: var(--muted);
    }

    .article-link{
      color: var(--primary);
      font-weight:700;
    }

    .testimonial-grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap:24px;
    }

    .quote-card{
      background: rgba(255,255,255,0.55);
      border:1px solid rgba(107,63,29,0.08);
      border-radius: 24px;
      padding: 24px 22px;
      box-shadow: var(--shadow);
    }

    .quote-mark{
      font-size: 2.4rem;
      color: var(--secondary);
      line-height:1;
    }

    .quote-card p{
      margin: 12px 0 18px;
      color: var(--muted);
    }

    .person{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .avatar{
      width:42px;
      height:42px;
      border-radius:50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: var(--white);
      display:grid;
      place-items:center;
      font-weight:800;
    }

    .person strong{
      display:block;
      color: var(--primary-dark);
    }

    .person span{
      color: var(--muted);
      font-size: 0.88rem;
    }

    .contact-grid{
      display:grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 28px;
      align-items: stretch;
    }

    .contact-card, .form-card{
      background: rgba(255,255,255,0.6);
      border:1px solid rgba(107,63,29,0.08);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 28px 24px;
    }

    .contact-list{
      display:grid;
      gap: 18px;
      margin-top: 20px;
    }

    .contact-item{
      display:flex;
      gap:14px;
      align-items:flex-start;
    }

    .contact-icon{
      width: 44px;
      height:44px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background: rgba(107,63,29,0.08);
      color: var(--primary);
      font-size:1.1rem;
      font-weight:700;
    }

    .contact-item strong{
      display:block;
      margin-bottom: 4px;
      color: var(--primary-dark);
    }

    .contact-item span, .contact-item a{
      color: var(--muted);
    }

    .form-card form{
      display:grid;
      gap:16px;
    }

    .field-row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:16px;
    }

    input, textarea{
      width:100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(107,63,29,0.15);
      background: rgba(255,255,255,0.8);
      color: var(--text);
      font: inherit;
      resize: vertical;
      min-height: 54px;
    }

    input:focus, textarea:focus{
      outline: 2px solid rgba(184,110,60,0.2);
      border-color: rgba(184,110,60,0.35);
    }

    textarea{
      min-height: 160px;
    }

    .footer{
      background: #2a1c14;
      color: rgba(255,255,255,0.85);
      padding: 40px 0 24px;
    }

    .footer .container{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-links{
      display:flex;
      flex-wrap:wrap;
      gap:16px;
    }

    .footer-links a{
      color: rgba(255,255,255,0.8);
    }

    @media (max-width: 980px){
      .hero-grid, .about-grid, .contact-grid{
        grid-template-columns: 1fr;
      }

      .feature-grid, .books-grid, .articles-grid, .testimonial-grid{
        grid-template-columns: repeat(2, minmax(0,1fr));
      }

      .menu{
        display:none;
        position:absolute;
        top:100%;
        left:0;
        right:0;
        padding: 18px 16px 20px;
        background: rgba(255,255,255,0.94);
        border-bottom:1px solid rgba(107,63,29,0.08);
        flex-direction:column;
        align-items:flex-start;
        box-shadow: 0 20px 30px rgba(0,0,0,0.04);
      }

      .menu.open{
        display:flex;
      }

      .mobile-toggle{
        display:grid;
        place-items:center;
      }

      .nav{
        position:relative;
      }
    }

    @media (max-width: 760px){
      .feature-grid, .books-grid, .articles-grid, .testimonial-grid, .check-list, .field-row{
        grid-template-columns: 1fr;
      }

      .timeline-wrap::before{
        left: 20px;
        transform:none;
      }

      .timeline-item{
        width: 100%;
        margin-left: 46px !important;
        margin-right: 0 !important;
      }

      .timeline-item::before{
        left: -31px !important;
        right:auto !important;
      }

      .topbar .container{
        justify-content:center;
      }

      .topbar .socials{
        display:none;
      }

      .portrait-card .img-wrap{
        height: 520px;
      }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="container">
      <div class="info">
        <span>📍 नई दिल्ली, भारत</span>
        <span>✉️ info@historyscholar.in</span>
        <span>📞 +91 98765 43210</span>
      </div>
      <div class="socials">
        <a href="#" aria-label="Facebook">f</a>
        <a href="#" aria-label="Twitter">x</a>
        <a href="#" aria-label="LinkedIn">in</a>
        <a href="#" aria-label="YouTube">▶</a>
      </div>
    </div>
  </div>

  <header class="site-header">
    <div class="container nav">
      <div class="brand">
        <div class="brand-mark">ह</div>
